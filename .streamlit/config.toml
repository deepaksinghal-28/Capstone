# Streamlit settings for the capstone dashboard

# Port / address are NOT set here on purpose: run_app.ps1 passes them for this
# PC (http://dbmonitor.localhost, port 80, loopback only), while hosting
# services such as Streamlit Community Cloud use their own defaults.

[server]
headless = true                # do not auto-open a browser tab
runOnSave = false

[browser]
gatherUsageStats = false       # no usage telemetry sent to Streamlit

[client]
toolbarMode = "minimal"

[theme]
base = "light"
primaryColor = "#2a78d6"
backgroundColor = "#f9f9f7"
secondaryBackgroundColor = "#f0efec"
textColor = "#0b0b0b"
font = "sans-serif"
